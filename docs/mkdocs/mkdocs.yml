# Gosmart.Health GRAPHITE — MkDocs site configuration.
#
# Build:   uv run mkdocs build --strict --clean   (from this directory)
# Preview: uv run mkdocs serve                    (from this directory)
#
# Reverse-proxy deployment: the built `site/` directory is static HTML with
# relative in-site links, so it can be served under any product slug. Set
# `site_url` below to the final public URL (scheme + host + product slug);
# it only affects canonical links, the sitemap, and social previews.

site_name: Gosmart.Health GRAPHITE
site_description: >-
  Gosmart.Health GRAPHITE — a graph-based clinical DICOM and FHIR integrated
  server: FastAPI, Neo4j knowledge graph, pydicom/pynetdicom services,
  DICOMweb, and a Model Context Protocol (MCP) server for AI agents.
site_author: GoSmart Health
# TODO(web-server team): align with the product-specific slug served by the
# reverse proxy, e.g. https://docs.gosmart.health/graphite/
site_url: https://docs.gosmart.health/graphite/

repo_name: gosmart-health/gosmart-graphite
repo_url: https://github.com/gosmart-health/gosmart-graphite
edit_uri: edit/main/docs/mkdocs/docs/

copyright: Copyright &copy; GoSmart Health &mdash; Licensed under Apache-2.0

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gosmart-health/gosmart-graphite
    - icon: fontawesome/solid/globe
      link: https://gosmart.health

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart (Docker): getting-started/quickstart-docker.md
      - First Steps: getting-started/first-steps.md
  - Configuration:
      - Overview: configuration/index.md
      - Environment Variables: configuration/environment-variables.md
      - DICOM Configurations: configuration/dicom-configurations.md
      - FHIR Configuration: configuration/fhir-configuration.md
      - LLM Configurations: configuration/llm-configurations.md
  - MCP (AI Agents):
      - Overview: mcp/index.md
      - Tool Catalog: mcp/tools.md
      - Utterance Examples: mcp/utterance-examples.md
  - About:
      - License: about/license.md
      - Release Notes: about/release-notes.md
