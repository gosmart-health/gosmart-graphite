# Gosmart.Health GRAPHITE — Zensical site configuration.
#
# Build:   uv run --group docs zensical build --strict --clean   (from this directory)
# Preview: uv run --group docs zensical serve                    (from this directory)
#
# Reverse-proxy deployment: the built `site/` directory is static HTML with
# relative in-site links, so it can be served under any product slug. Set
# `site_url` below to the final public URL (scheme + host + product slug);
# it only affects canonical links, the sitemap, and social previews.

[project]
site_name = "Gosmart.Health GRAPHITE"
site_description = "Gosmart.Health GRAPHITE — a graph-based clinical DICOM and FHIR integrated server: FastAPI, Neo4j knowledge graph, pydicom/pynetdicom services, DICOMweb, and a Model Context Protocol (MCP) server for AI agents."
site_author = "GoSmart Health"
site_url = "https://gosmart.health/docs/graphite"

repo_name = "gosmart-health/gosmart-graphite"
repo_url = "https://github.com/gosmart-health/gosmart-graphite"
edit_uri = "edit/main/docs/zensical/docs/"

copyright = "Copyright &copy; GoSmart Health &mdash; Licensed under Apache-2.0"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Overview" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart (Docker)" = "getting-started/quickstart-docker.md" },
    { "First Steps" = "getting-started/first-steps.md" },
    { "Cypher Query Guide" = "getting-started/cypher-query-guide.md" },
    { "Testing & Ecosystem" = "getting-started/testing-ecosystem.md" },
  ] },
  { "Configuration" = [
    { "Overview" = "configuration/index.md" },
    { "Environment Variables" = "configuration/environment-variables.md" },
    { "Bootstrapping & Administration" = "configuration/administration.md" },
    { "DICOM Configurations" = "configuration/dicom-configurations.md" },
    { "DICOM Conformance Statement" = "configuration/dicom-conformance-statement.md" },
    { "FHIR Configuration" = "configuration/fhir-configuration.md" },
    { "LLM Configurations" = "configuration/llm-configurations.md" },
  ] },
  { "MCP (AI Agents)" = [
    { "Overview" = "mcp/index.md" },
    { "Tool Catalog" = "mcp/tools.md" },
    { "Utterance Examples" = "mcp/utterance-examples.md" },
  ] },
  { "About" = [
    { "License" = "about/license.md" },
    { "Release Notes" = "about/release-notes.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/gosmart-health/gosmart-graphite"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://gosmart.health"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
