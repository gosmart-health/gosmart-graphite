[project]
name = "gosmart-dicom-py-graph-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adlfs>=2026.8.0",
    "fastapi>=0.141.1",
    "fsspec>=2026.9.0",
    "gcsfs>=2026.8.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "mcp>=2.2.0",
    "neo4j>=6.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pydicom>=3.0.2",
    "pykka>=4.4.2",
    "pynetdicom>=3.0.4",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "s3fs>=2026.9.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gosmart-gs = "cli:cli_app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actor", "api", "core", "db", "model", "service"]
only-include = ["actor", "api", "core", "db", "model", "service", "cli.py", "main.py"]

[dependency-groups]
dev = [
    "cyclonedx-bom>=5.1.0",
    "pip-audit>=2.7.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]

