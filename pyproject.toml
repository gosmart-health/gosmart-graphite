[project]
name = "gosmart-graphite"
version = "0.1.0"
description = "Gosmart.Health GRAPHITE — Graph-Based Clinical DICOM and FHIR Integrated Server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adlfs>=2026.8.0",
    "argon2-cffi>=23.1.0",
    "cryptography==50.0.2",
    "fastapi==0.163.1",
    "fhir-resources>=8.3.0",
    "fsspec==2026.9.0",
    "gcsfs==2026.10.1",
    "genkit>=0.13.0",
    "genkit-google-genai>=0.13.0",
    "genkit-ollama>=0.13.0",
    "gosmart-clinical-nlu",
    "httpx>=0.28.1",
    "ipykernel==7.4.0",
    "mcp==2.3.0",
    "neo4j==6.4.1",
    "numpy>=2.5.4",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pydicom==3.0.2",
    "pyjwt>=2.8.0",
    "pykka==4.5.0",
    "pynetdicom>=3.0.4",
    "pyrefly>=0.60.0",
    "pytest==9.2.0",
    "python-multipart==0.0.33",
    "rich==15.0.0",
    "s3fs>=2026.9.0",
    "structlog>=26.1.0",
    "typer==0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gosmart-graphite = "gosmart_graphite.cli:cli_app"
gosmart-gs = "gosmart_graphite.cli:cli_app"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosmart_graphite"]

[dependency-groups]
dev = [
    "cyclonedx-bom==8.0.1",
    "pip-audit>=2.7.0",
    "ruff==0.17.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "."]
extend-exclude = ["notebooks", "skills", "**/*.md"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["gosmart_graphite", "tests"]

[tool.uv.sources]
gosmart-clinical-nlu = { git = "https://github.com/gosmart-health/gosmart-clinical-nlu.git", rev = "main" }
