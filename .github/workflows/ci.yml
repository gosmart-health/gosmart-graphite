name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sensitive Secrets from GitHub Secrets (secrets.*)
  GOSMART_GS_INITIAL_ADMIN_PASSWORD: ${{ secrets.GOSMART_GS_INITIAL_ADMIN_PASSWORD }}
  GOSMART_GS_DB_USER: ${{ secrets.GOSMART_GS_DB_USER }}
  GOSMART_GS_DB_PASSWORD: ${{ secrets.GOSMART_GS_DB_PASSWORD }}
  GOSMART_GS_VERTEX_AI_API_KEY: ${{ secrets.GOSMART_GS_VERTEX_AI_API_KEY }}
  API_KEY: ${{ secrets.API_KEY }}

  # Non-Sensitive Configuration from GitHub Variables (vars.*)
  GOSMART_GS_INITIAL_ADMIN_EMAIL: ${{ vars.GOSMART_GS_INITIAL_ADMIN_EMAIL }}
  GOSMART_GS_INITIAL_ADMIN_USERNAME: ${{ vars.GOSMART_GS_INITIAL_ADMIN_USERNAME }}
  GOSMART_GS_DB_CONNECTION_URI: ${{ vars.GOSMART_GS_DB_CONNECTION_URI }}
  GOSMART_GS_DB_DATABASE: ${{ vars.GOSMART_GS_DB_DATABASE }}
  GOSMART_GS_DB_AURA_INSTANCE_ID: ${{ vars.GOSMART_GS_DB_AURA_INSTANCE_ID }}
  GOSMART_GS_DB_AURA_INSTANCE_NAME: ${{ vars.GOSMART_GS_DB_AURA_INSTANCE_NAME }}
  GOSMART_GS_STORAGE_ROOT_URI: ${{ vars.GOSMART_GS_STORAGE_ROOT_URI }}
  GOSMART_GS_HOST: ${{ vars.GOSMART_GS_HOST }}
  GOSMART_GS_PORT: ${{ vars.GOSMART_GS_PORT }}
  GOSMART_GS_RELOAD: ${{ vars.GOSMART_GS_RELOAD }}
  GOSMART_GS_LOG_LEVEL: ${{ vars.GOSMART_GS_LOG_LEVEL }}
  GOSMART_GS_LOG_FORMAT: ${{ vars.GOSMART_GS_LOG_FORMAT }}
  GOSMART_GS_LOG_DIR: ${{ vars.GOSMART_GS_LOG_DIR }}
  GOSMART_GS_LOG_FILE: ${{ vars.GOSMART_GS_LOG_FILE }}
  GOSMART_GS_LOG_ROTATION_DAYS: ${{ vars.GOSMART_GS_LOG_ROTATION_DAYS }}
  GOSMART_GS_LOG_BACKUP_COUNT: ${{ vars.GOSMART_GS_LOG_BACKUP_COUNT }}
  GOSMART_GS_LOG_TO_FILE: ${{ vars.GOSMART_GS_LOG_TO_FILE }}
  GOSMART_GS_DICOM_AE_TITLE: ${{ vars.GOSMART_GS_DICOM_AE_TITLE }}
  GOSMART_GS_DICOM_SCP_HOST: ${{ vars.GOSMART_GS_DICOM_SCP_HOST }}
  GOSMART_GS_DICOM_SCP_PORT: ${{ vars.GOSMART_GS_DICOM_SCP_PORT }}
  GOSMART_GS_DICOM_SCP_ENABLED: ${{ vars.GOSMART_GS_DICOM_SCP_ENABLED }}
  GOSMART_GS_FHIR_BASE_URL: ${{ vars.GOSMART_GS_FHIR_BASE_URL }}
  GOSMART_GS_FHIR_POLL_SEC: ${{ vars.GOSMART_GS_FHIR_POLL_SEC }}
  GOSMART_GS_FHIR_PATIENT_ID_SYSTEM: ${{ vars.GOSMART_GS_FHIR_PATIENT_ID_SYSTEM }}
  GOSMART_GS_VECTOR_EMBED_PROVIDER: ${{ vars.GOSMART_GS_VECTOR_EMBED_PROVIDER }}
  GOSMART_GS_VECTOR_EMBED_SERVER_URL: ${{ vars.GOSMART_GS_VECTOR_EMBED_SERVER_URL }}
  GOSMART_GS_VECTOR_EMBED_MODEL: ${{ vars.GOSMART_GS_VECTOR_EMBED_MODEL }}
  GOSMART_GS_VECTOR_EMBED_DIMENSIONS: ${{ vars.GOSMART_GS_VECTOR_EMBED_DIMENSIONS }}

jobs:
  security-and-lint:
    name: Security & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Verify Lockfile Synchronization
        run: uv lock --check

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Ruff Formatting Check
        run: uv run ruff format --check .

      - name: Run Package Security Vulnerability Audit
        run: uv run pip-audit

      - name: Generate and Validate CycloneDX SBOM
        run: uv run cyclonedx-py environment --pyproject pyproject.toml .venv -o sbom.json --validate

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error

  unit-tests:
    name: Unit Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [security-and-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Generate .env File from GitHub Secrets & Variables
        run: |
          cat <<EOF > .env
          GOSMART_GS_INITIAL_ADMIN_EMAIL="${GOSMART_GS_INITIAL_ADMIN_EMAIL}"
          GOSMART_GS_INITIAL_ADMIN_USERNAME="${GOSMART_GS_INITIAL_ADMIN_USERNAME}"
          GOSMART_GS_INITIAL_ADMIN_PASSWORD="${GOSMART_GS_INITIAL_ADMIN_PASSWORD}"
          GOSMART_GS_DB_CONNECTION_URI="${GOSMART_GS_DB_CONNECTION_URI}"
          GOSMART_GS_DB_USER="${GOSMART_GS_DB_USER}"
          GOSMART_GS_DB_PASSWORD="${GOSMART_GS_DB_PASSWORD}"
          GOSMART_GS_DB_DATABASE="${GOSMART_GS_DB_DATABASE}"
          GOSMART_GS_DB_AURA_INSTANCE_ID="${GOSMART_GS_DB_AURA_INSTANCE_ID}"
          GOSMART_GS_DB_AURA_INSTANCE_NAME="${GOSMART_GS_DB_AURA_INSTANCE_NAME}"
          GOSMART_GS_STORAGE_ROOT_URI="${GOSMART_GS_STORAGE_ROOT_URI}"
          GOSMART_GS_HOST="${GOSMART_GS_HOST}"
          GOSMART_GS_PORT="${GOSMART_GS_PORT}"
          GOSMART_GS_RELOAD="${GOSMART_GS_RELOAD}"
          GOSMART_GS_LOG_LEVEL="${GOSMART_GS_LOG_LEVEL}"
          GOSMART_GS_LOG_FORMAT="${GOSMART_GS_LOG_FORMAT}"
          GOSMART_GS_LOG_DIR="${GOSMART_GS_LOG_DIR}"
          GOSMART_GS_LOG_FILE="${GOSMART_GS_LOG_FILE}"
          GOSMART_GS_LOG_ROTATION_DAYS="${GOSMART_GS_LOG_ROTATION_DAYS}"
          GOSMART_GS_LOG_BACKUP_COUNT="${GOSMART_GS_LOG_BACKUP_COUNT}"
          GOSMART_GS_LOG_TO_FILE="${GOSMART_GS_LOG_TO_FILE}"
          GOSMART_GS_DICOM_AE_TITLE="${GOSMART_GS_DICOM_AE_TITLE}"
          GOSMART_GS_DICOM_SCP_HOST="${GOSMART_GS_DICOM_SCP_HOST}"
          GOSMART_GS_DICOM_SCP_PORT="${GOSMART_GS_DICOM_SCP_PORT}"
          GOSMART_GS_DICOM_SCP_ENABLED="${GOSMART_GS_DICOM_SCP_ENABLED}"
          GOSMART_GS_FHIR_BASE_URL="${GOSMART_GS_FHIR_BASE_URL}"
          GOSMART_GS_FHIR_POLL_SEC="${GOSMART_GS_FHIR_POLL_SEC}"
          GOSMART_GS_FHIR_PATIENT_ID_SYSTEM="${GOSMART_GS_FHIR_PATIENT_ID_SYSTEM}"
          GOSMART_GS_VECTOR_EMBED_PROVIDER="${GOSMART_GS_VECTOR_EMBED_PROVIDER}"
          GOSMART_GS_VECTOR_EMBED_SERVER_URL="${GOSMART_GS_VECTOR_EMBED_SERVER_URL}"
          GOSMART_GS_VECTOR_EMBED_MODEL="${GOSMART_GS_VECTOR_EMBED_MODEL}"
          GOSMART_GS_VECTOR_EMBED_DIMENSIONS="${GOSMART_GS_VECTOR_EMBED_DIMENSIONS}"
          GOSMART_GS_VERTEX_AI_API_KEY="${GOSMART_GS_VERTEX_AI_API_KEY}"
          API_KEY="${API_KEY}"
          EOF

      - name: Run Unit Tests
        run: uv run pytest --verbose

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: gosmart-graphite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
