name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-and-lint:
    name: Security & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Verify Lockfile Synchronization
        run: uv lock --check

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Ruff Formatting Check
        run: uv run ruff format --check .

      - name: Run Package Security Vulnerability Audit
        run: uv run pip-audit

      - name: Generate and Validate CycloneDX SBOM
        run: uv run cyclonedx-py environment --pyproject pyproject.toml .venv -o sbom.json --validate

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error

  unit-tests:
    name: Unit Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [security-and-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: uv run pytest tests/unit --verbose
        env:
          GOSMART_GS_DICOM_SCP_ENABLED: "false"
          GOSMART_GS_STORAGE_ROOT_URI: file:///tmp/gosmart-graphite-ci-storage
          GOSMART_GS_LOG_TO_FILE: "false"

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: gosmart-graphite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
