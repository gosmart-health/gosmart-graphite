services:
  graph-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gosmart-dicom-graph-server
    restart: unless-stopped
    ports:
      - "8086:8086"
      - "11112:11112"
    environment:
      - GOSMART_GS_HOST=0.0.0.0
      - GOSMART_GS_PORT=8086
      - GOSMART_GS_RELOAD=false
      - GOSMART_GS_DB_CONNECTION_URI=bolt://neo4j:7687
      - GOSMART_GS_DB_USER=neo4j
      - GOSMART_GS_DB_PASSWORD=neo4j
      - GOSMART_GS_DB_DATABASE=neo4j
      - GOSMART_GS_STORAGE_ROOT_URI=file:///tmp/gosmart_dicom_storage
      - GOSMART_GS_DICOM_AE_TITLE=GOSMART_GS
      - GOSMART_GS_DICOM_SCP_PORT=11112
    volumes:
      - dicom_storage:/tmp/gosmart_dicom_storage
      - server_logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:latest
    container_name: gosmart-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Neo4j Browser & HTTP API
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neo4j_data:
  neo4j_logs:
  dicom_storage:
  server_logs:

